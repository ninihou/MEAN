<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        padding: 40px 20px;
      }

      h1 {
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 30px;
        color: #222;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
      }

      .row {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
      }

      .row input {
        flex: 1;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="password"] {
        width: 100%;
        padding: 18px 16px;
        font-size: 1rem;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        color: #aaa;
        outline: none;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="tel"]:focus,
      input[type="password"]:focus {
        border-color: #6ab0f5;
      }

      .agree-row {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 16px;
      }

      .agree-left {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        font-size: 1rem;
        font-weight: bold;
      }

      .agree-left input[type="checkbox"] {
        width: 18px;
        height: 18px;
      }

      .agree-right {
        font-size: 0.9rem;
        color: #333;
        line-height: 1.5;
      }

      .agree-right .btn-inline {
        display: inline-block;
        background-color: #5b8dd9;
        color: #fff;
        padding: 2px 10px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: bold;
        text-decoration: none;
      }

      .agree-right a {
        color: #5b8dd9;
        text-decoration: none;
      }

      .btn-row {
        display: flex;
        gap: 16px;
      }

      .btn-register,
      .btn-signin {
        flex: 1;
        padding: 18px;
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .btn-register {
        background-color: #5b8dd9;
      }

      .btn-signin {
        background-color: #5cac5c;
      }

      @media (max-width: 500px) {
        .row,
        .btn-row {
          flex-direction: column;
        }

        .agree-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Sign Up</h1>

      <form action="#" method="post">
        <div class="row">
          <input type="text" name="first_name" placeholder="First Name" />
          <input type="text" name="last_name" placeholder="Last Name" />
        </div>

        <div class="row">
          <input type="tel" name="mobile" placeholder="Mobile No." />
        </div>

        <div class="row">
          <input type="email" name="email" placeholder="Email Address" />
        </div>

        <div class="row">
          <input type="password" name="password" placeholder="Password" />
          <input type="password" name="confirm_password" placeholder="Confirm Password" />
        </div>

        <div class="agree-row">
          <div class="agree-left">
            <input type="checkbox" id="agree" name="agree" />
            <label for="agree">I Agree</label>
          </div>
          <p class="agree-right">
            By clicking <a href="#" class="btn-inline">Register</a>, you agree to the
            <a href="#">Terms and Conditions</a> set out by this site, including our Cookie Use.
          </p>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn-register">Register</button>
          <button type="button" class="btn-signin">Sign In</button>
        </div>
      </form>
    </div>
  </body>
</html>
